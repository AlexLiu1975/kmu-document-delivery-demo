<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>公文網站使用報表｜管理者</title><link rel="stylesheet" href="styles.css"><style>main{max-width:1500px}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{padding:10px;border-bottom:1px solid #d6dee7;text-align:left}th{background:#e6eff5}.scroll{overflow:auto;margin:16px 0}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center}#metrics{font-size:18px;font-weight:bold;margin:18px 0}#message{padding:12px}input,select{max-width:240px}</style></head><body><main><div class="card"><h1>公文網站使用報表</h1><p>僅限授權管理者使用 Google 帳號登入，職號登入不會授予報表權限。</p><div class="controls"><button id="admin-login" class="button primary">Google 管理者登入</button><button id="admin-logout" class="button secondary" hidden>登出管理者</button><a href="index.html">回公文登記簿</a></div><p id="message" role="status">請登入以查看報表。</p><section id="report-content" hidden><div class="controls"><label>期間 <select id="report-days"><option value="7">最近 7 天</option><option value="30" selected>最近 30 天</option><option value="90">最近 90 天</option></select></label><label>職號 <input id="report-employee" placeholder="全部職號" maxlength="7"></label><button id="report-refresh" class="button secondary">更新報表</button><button id="report-csv" class="button secondary">匯出完整紀錄 CSV</button></div><div id="metrics"></div><p>統計採臺灣時間。IP 與匿名 UID 不代表人數，職號由使用者輸入。資料同步後自動更新，僅包含啟用紀錄後的使用情況。</p><h2>各職號使用情況</h2><div id="employee-table" class="scroll"></div><h2>每日使用情況</h2><div id="daily-table" class="scroll"></div><details><summary>完整紀錄（含文號與完整 IP）</summary><div id="record-table" class="scroll"></div></details></section></div></main><script src="usage-core.js"></script><script type="module" src="admin-report.js"></script></body></html>
